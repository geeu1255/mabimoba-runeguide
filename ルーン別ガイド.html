<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ルーン別ガイド</title>
<style>
/* layout-1113 */
/* 文字は16px以上（14pxは★・部位・並びの札だけ）、行の高さ1.7、余白は8pxの倍数。
   大きさ: 22px太字（ルーンの名前）／18px太字（クラスの名前）／16px（効果・状況・理由。理由は色を薄く）。 */
:root{color-scheme:light;
  --bg:#eceef0;--surface:#fff;--sunk:#f4f6f7;--ink:#1a1f24;--muted:#5d666f;--line:#c9d0d5;--edge:#7a848c;--chip:#e8ecee;
  --banner:#1b2226;--on-banner:#fff;--banner-sub:#c5ced2;--link:#0017c1;
  --good:#1a7f4b;--good-bg:#e2f2e9;--mid:#876800;--mid-bg:#f5eed7;--bad:#b03a2f;--bad-bg:#f6e3e1;
  --s6:#a84f00;--s5:#8a3fb5;--s4:#2f6db3;  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.7;letter-spacing:.02em;-webkit-text-size-adjust:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1080px;margin:0 auto}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #000;outline-offset:2px;box-shadow:0 0 0 2px #ffd43d}
.banner{background:var(--banner);color:var(--on-banner)}
.banner .inner{padding-block:32px 24px}
.eyebrow{font-size:14px;line-height:1.6;font-weight:700;letter-spacing:.06em;color:var(--banner-sub)}
h1{margin:8px 0;font-weight:900;font-size:clamp(28px,6vw,40px);letter-spacing:.04em;line-height:1.3}
.banner p{margin:0;color:#dfe5e8;font-size:16px;line-height:1.7;max-width:42em}
.banner .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.banner .links a{display:inline-flex;align-items:center;min-height:44px;font-size:16px;font-weight:700;color:var(--on-banner);text-decoration:none;border:1px solid var(--banner-sub);border-radius:8px;padding:4px 16px;white-space:nowrap}
.banner .links a:hover{border-color:#fff;text-decoration:underline;text-underline-offset:.2em}
.banner a:focus-visible{outline-color:#ffd43d;box-shadow:none}

/* 検索バー */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .inner{display:flex;flex-direction:column;gap:8px;padding-block:12px}
.srow{display:flex;gap:16px;align-items:center}
#q{flex:1;min-width:0;min-height:48px;font:inherit;font-size:16px;padding:8px 16px;border:1px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink)}
#q::placeholder{color:var(--muted)}
.cf{flex:none;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap}
#cls{min-height:48px;font:inherit;font-size:16px;font-weight:700;padding:8px 12px;border:1px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);min-width:11.5em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{flex:none;min-height:40px;font:inherit;font-size:16px;line-height:1.5;font-weight:700;padding:6px 16px;border-radius:8px;border:1px solid var(--edge);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

main{padding-block:16px 48px}
.sec{margin:40px 0 16px;font-size:24px;line-height:1.4;font-weight:900;display:flex;align-items:baseline;gap:12px}
.sec:first-child{margin-top:8px}
.sec small{font-size:14px;color:var(--muted);font-weight:700}
.chead{margin:32px 0 12px;font-size:20px;line-height:1.5;font-weight:900;display:flex;align-items:center;gap:8px}
.chead::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c)}
.none{color:var(--muted);font-size:16px;padding:16px 4px;margin:0}
.miss{margin:16px 0;padding:16px;background:var(--surface);border:2px solid var(--ink);border-radius:12px}
.miss p{margin:0}
.miss .m1{font-size:22px;font-weight:900;line-height:1.5}
.miss .m2{margin-top:8px;font-size:16px;font-weight:700;color:var(--muted)}
.miss .m2 small{margin-left:8px;font-size:14px}

/* ルーンのカード */
.rl{display:flex;flex-direction:column;gap:24px}
.rn{background:var(--surface);border-radius:12px;border:1px solid var(--edge);overflow:hidden;scroll-margin-top:136px}
.top-part{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 16px;align-items:start;padding:16px;background:#fff;border-bottom:2px solid var(--ink)}
.ri{width:48px;height:48px;border-radius:8px;background:#39434d center/80% no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

.nm{display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
.nm b{font-size:22px;line-height:1.4;font-weight:900;letter-spacing:.02em;margin-right:4px}
.st{font-size:14px;line-height:1.6;font-weight:900;white-space:nowrap}
.s6{color:var(--s6)}.s5{color:var(--s5)}.s4{color:var(--s4)}
.pt{font-size:14px;line-height:1.6;font-weight:700;color:var(--ink);background:var(--chip);border-radius:4px;padding:0 8px;white-space:nowrap}
.only{font-size:14px;line-height:1.5;font-weight:700;color:var(--bad);border:1px solid currentColor;border-radius:4px;padding:0 8px;white-space:nowrap}
/* レイドのルーン（神聖・破滅）の表示と注意。クラスの色とかぶらないよう、黒と灰色だけで作る */
.tg{font-size:14px;line-height:1.6;font-weight:900;border-radius:4px;padding:0 8px;white-space:nowrap;color:#fff;background:var(--ink)}
.tg i{font-style:normal;font-weight:700;opacity:.85;margin-right:4px}
.uq{margin:0;padding:12px 16px;background:#e9ebed;border-left:8px solid var(--ink);border-bottom:1px solid var(--edge);font-size:16px;line-height:1.7}
.uq .uqh{display:inline-block;font-weight:900;font-size:16px;color:#fff;background:var(--ink);border-radius:4px;padding:0 12px;margin-bottom:4px}
.uq p{margin:4px 0 0;max-width:46em;text-wrap:balance;word-break:auto-phrase;line-break:strict}
.uq b{font-weight:900}
.uq .fx{margin:4px 0 4px 1em}
.ef{font-size:16px;line-height:1.7;color:var(--ink);margin-top:4px;max-width:46em}
.ef>span{display:block;text-wrap:balance;line-break:strict}
.ef>span.lg{text-wrap:pretty;word-break:auto-phrase}   /* 長い行は balance が当たらないので、文節で折る */
.ef>span:empty{height:.8em}

/* 使うクラスの縦の一覧: 順位のまとまり → クラスの行 → 状況と理由 */
.ul{margin:0}
.grp{border-bottom:1px solid var(--edge)}
.grp:last-child{border-bottom:none}
.gh{padding:8px 16px;background:#e9edf0;border-bottom:1px solid var(--line)}
.bd{display:inline-block;font-size:16px;font-weight:900;white-space:nowrap;border-radius:4px;padding:0 12px;line-height:1.7;background:var(--ink);color:#fff}
.grp.mid .bd{background:#fff;color:var(--ink);border:1px solid var(--muted);padding:0 11px}
.gh .plain{font-size:16px;font-weight:900;color:var(--ink)}
.cr{display:grid;grid-template-columns:168px minmax(0,1fr);gap:0 16px;padding:0 16px;border-top:1px solid var(--line);background:#fff}
.gh + .cr{border-top:none}
.cn{display:flex;flex-direction:column;justify-content:center;font-size:18px;font-weight:900;line-height:1.6;padding:8px 0}
.cn span{color:var(--c)}
.cn span.sel{align-self:flex-start;background:var(--c);color:#fff;border-radius:4px;padding:0 8px;margin-left:-8px}
.cr.selrow{box-shadow:inset 0 0 0 2px var(--c)}
.cu.selcard{box-shadow:inset 0 0 0 2px var(--c)}
.sl{display:flex;flex-direction:column;min-width:0}
.ln{display:grid;grid-template-columns:16em minmax(0,1fr);gap:0 16px;line-height:1.7;padding:8px 0}

ls": null, "tiers": [6], "text": "トップスに刻印時、通常攻撃が30％の確率でターゲットに威力1250%の持続ダメージ:火傷を付与する。\nボトムスに刻印時、スキル攻撃が30％の確率でターゲットに威力1250%の持続ダメージ:氷結を付与する。(クールタイム: 10秒)", "only": null}, {"key": "防具|凍結+", "part": "防具", "name": "凍結+", "cls": null, "tiers": [6], "text": "持続ダメージ:氷結が付与されている敵を攻撃時、5秒後に威力520%の追加ダメージを与える。(クールタイム: 5秒)", "only": null}, {"key": "防具|凝縮された魔力", "part": "防具", "name": "凝縮された魔力", "cls": null, "tiers": [6], "text": "保有中のリソースが50%未満の場合、攻撃力が15%アップする。(魔法使い系クラス専用)", "only": "魔法使い系"}, {"key": "防具|出血の刃", "part": "防具", "name": "出血の刃", "cls": null, "tiers": [6], "text": "強打命中時、該当のスキル威力の20％の持続ダメージ:傷を付与する。(戦士系クラス専用)", "only": "戦士系"}, {"key": "防具|初期+", "part": "防具", "name": "初期+", "cls": null, "tiers": [6], "text": "戦闘開始時、30秒間、攻撃力が20%アップする。", "only": null}, {"key": "防具|卑劣な一撃", "part": "防具", "name": "卑劣な一撃", "cls": null, "tiers": [6], "text": "カウンター攻撃命中時、4秒間、攻撃力が24%アップする。", "only": null}, {"key": "防具|反作用", "part": "防具", "name": "反作用", "cls": null, "tiers": [6], "text": "被ダメージ時、50％の確率で周辺4m以内にいる全ての敵に威力160%のダメージを与える衝撃波を発散する。(クールタイム: 0.5秒)", "only": null}, {"key": "防具|吸血+", "part": "防具", "name": "吸血+", "cls": null, "tiers": [6], "text": "持続ダメージ:傷を保有中の敵を攻撃時、8秒間、攻撃力が15%アップする。(クールタイム: 12秒)", "only": null}, {"key": "防具|城塞+", "part": "防具", "name": "城塞+", "cls": null, "tiers": [6], "text": "HPが75%以上の場合、被ダメージが10%ダウンする。", "only": null}, {"key": "防具|安定+", "part": "防具", "name": "安定+", "cls": null, "tiers": [6], "text": "HPが75%以上の場合、攻撃力が11%アップする。", "only": null}, {"key": "防具|岩の巨人", "part": "防具", "name": "岩の巨人", "cls": null, "tiers": [6], "text": "強打命中時、攻撃力が3%アップし、該当の効果は最大3回まで重複する。3重複到達時、重複を全て消費し、5秒間、攻撃力が20%アップする。", "only": null}, {"key": "防具|巨人の腕", "part": "防具", "name": "巨人の腕", "cls": null, "uniq": "破滅のルーン", "pair": "飢えた刃", "tiers": [6], "text": "攻撃命中時、対象と周辺2.5m内にいる敵に威力1040%のダメージを与え、弱体化効果:防具破壊を付与し、10秒間、被ダメージを10%アップさせ、追加で破壊された鎧を付与する。破壊された鎧効果終了時、敵に弱体化効果:拘束の刃が付与されていると、威力350%のダメージを与える。防具破壊は重複適用されない。(クールタイム: 10秒)", "only": null}, {"key": "防具|平原の放浪者", "part": "防具", "name": "平原の放浪者", "cls": null, "tiers": [6], "text": "移動スキル使用時、10秒間、与ダメージが12%アップし、移動速度が30%アップする。", "only": null}, {"key": "防具|悟り", "part": "防具", "name": "悟り", "cls": null, "tiers": [6], "text": "クラスレベルが40以上の場合、攻撃力が6%アップし、クラスレベルが65以上の場合、4%追加でアップする。", "only": null}, {"key": "防具|戦慄する楽想", "part": "防具", "name": "戦慄する楽想", "cls": null, "tiers": [6], "text": "パーティープレイ時、攻撃力が12%アップする。(吟遊詩人系クラス専用)", "only": "吟遊詩人系"}, {"key": "防具|放浪騎士", "part": "防具", "name": "放浪騎士", "cls": null, "tiers": [6], "text": "敵を挑発してHPの5％のダメージを吸収するバリアを作り、挑発した敵に威力380%の持続ダメージ:恐怖と威力380%の持続ダメージ:傷を付与する。", "only": null}, {"key": "防具|暴風+", "part": "防具", "name": "暴風+", "cls": null, "tiers": [6], "text": "ノーガード攻撃命中時、5秒間、スキル使用速度及び攻撃速度が40%アップする。", "only": null}, {"key": "防具|暴風雲", "part": "防具", "name": "暴風雲", "cls": null, "tiers": [6], "text": "戦闘中、15秒ごとに周辺8m以内にいる最大6体の敵に雷を落とし、威力1610%のダメージを与え、それぞれの周辺の狭い範囲の敵にも威力200%のダメージを与える。", "only": null}, {"key": "防具|松明", "part": "防具", "name": "松明", "cls": null, "tiers": [6], "text": "持続ダメージ:火傷が付与されている敵を攻撃時、5秒間、クリティカル率が10%アップする。(クールタイム: 3秒)", "only": null}, {"key": "防具|果てしない活力", "part": "防具", "name": "果てしない活力", "cls": null, "tiers": [6], "text": "追加攻撃命中時、自身のHPを1.3％回復する。(クールタイム: 0.5秒)", "only": null}, {"key": "防具|枯れた地", "part": "防具", "name": "枯れた地", "cls": null, "tiers": [6], "text": "保有中のリソースが50％未満の場合、与ダメージが9%、追加攻撃率が6%アップする。", "only": null}, {"key": "防具|極夜", "part": "防具", "name": "極夜", "cls": null, "tiers": [6], "text": "持続ダメージ:審判が付与されている敵を攻撃時、追加で威力310%の持続ダメージ:絶望を付与する。(クールタイム: 3秒)", "only": null}, {"key": "防具|毒霧", "part": "防具", "name": "毒霧", "cls": null, "tiers": [6], "text": "攻撃命中時、ターゲットの位置に4秒間持続する毒霧を作る。毒霧は3m以内にいる敵に1秒ごとに威力100%の持続ダメージ:中毒を付与する。(クールタイム: 4秒)", "only": null}, {"key": "防具|永久凍土", "part": "防具", "name": "永久凍土", "cls": null, "tiers": [6], "text": "戦闘中、1秒ごとに周辺4m以内にいる敵に威力120%の持続ダメージ:氷結を付与する。", "only": null}, {"key": "防具|激しいにわか雨", "part": "防具", "name": "激しいにわか雨", "cls": null, "tiers": [6], "text": "究極技を使用時、与ダメージが15秒間、30%アップする。", "only": null}, {"key": "防具|激痛+", "part": "防具", "name": "激痛+", "cls": null, "tiers": [6], "text": "持続ダメージ:恐怖が付与されている敵を攻撃時、敵の周辺6m内にいる敵に威力400%の持続ダメージ:恐怖を付与する。(クールタイム: 5秒)", "only": null}, {"key": "防具|燃え上がる心臓", "part": "防具", "name": "燃え上がる心臓", "cls": null, "uniq": "神聖のルーン", "pair": "降り注ぐ火炎", "tiers": [6], "text": "戦闘中、5秒ごとに与ダメージが1.2％アップし、被ダメージが0.4％アップする。\n該当の効果は最大10回まで重複し、降り注ぐ火炎の刻印を保有中の場合、被ダメージアップ効果が被ダメージダウン効果に切り替わる。", "only": null}, {"key": "防具|狂暴な意志", "part": "防具", "name": "狂暴な意志", "cls": null, "tiers": [6], "text": "被ダメージ時、35％の確率で究極技ゲージを9獲得する。(クールタイム: 3秒)", "only": null}, {"key": "防具|狙撃+", "part": "防具", "name": "狙撃+", "cls": null, "tiers": [6], "text": "3秒間、動かずにいると攻撃力が15%アップする。", "only": null}, {"key": "防具|生命+", "part": "防具", "name": "生命+", "cls": null, "tiers": [6], "text": "被ダメージ時、10秒間防御力が0.5％アップし、HPを合計0.4％回復する。該当の効果は最大10回まで重複する。", "only": null}, {"key": "防具|生存本能", "part": "防具", "name": "生存本能", "cls": null, "tiers": [6], "text": "敵の攻撃によるブレイク状態の場合、6秒間、被ダメージが30%ダウンする。", "only": null}, {"key": "防具|生贄+", "part": "防具", "name": "生贄+", "cls": null, "tiers": [6], "text": "持続ダメージ:審判が付与されている敵を攻撃時、HPを最大HPの1.8%回復する。(クールタイム: 5秒)", "only": null}, {"key": "防具|砕氷", "part": "防具", "name": "砕氷", "cls": null, "tiers": [6], "text": "持続ダメージ:氷結が付与されている敵を攻撃時、5秒間、追加攻撃率が10%アップする。(クールタイム: 3秒)", "only": null}, {"key": "防具|破滅の烙印", "part": "防具", "name": "破滅の烙印", "cls": null, "uniq": "破滅のルーン", "pair": "共鳴する水晶", "tiers": [6], "text": "攻撃命中時、ターゲットに弱体化効果:破滅の烙印を付与し、1秒ごとに90%の暗黒ダメージを8秒間与える。\n破滅の烙印は単体にのみ付与される。\n破滅の烙印が終了する度に次の破滅の烙印のダメージが10％アップし、該当の効果は最大10回まで重複する。\n共鳴する水晶の刻印を保有中の場合、序の口重複5回が付与される。", "only": null}, {"key": "防具|聖なる修行", "part": "防具", "name": "聖なる修行", "cls": null, "tiers": [6], "text": "補助スキル使用時、10秒間、攻撃力と味方に与える回復量が4%アップし、該当の効果は最大3回まで重複する。(ヒーラー系クラス専用)", "only": "ヒーラー系"}, {"key": "防具|衰弱+", "part": "防具", "name": "衰弱+", "cls": null, "tiers": [6], "text": "持続ダメージ:中毒が付与されている敵を攻撃時、威力520%の追加ダメージを与える。(クールタイム: 5秒)", "only": null}, {"key": "防具|襲いかかる影", "part": "防具", "name": "襲いかかる影", "cls": null, "tiers": [6], "text": "連打命中時、ターゲットに威力55%の持続ダメージ:絶望を付与し、10秒間、与ダメージが3%アップする。該当の効果は最大3回まで重複する。(クールタイム0.5秒)", "only": null}, {"key": "防具|赤い盟約", "part": "防具", "name": "赤い盟約", "cls": null, "tiers": [6], "text": "攻撃命中時、自身の位置に10秒間維持される魔力のルーンを作る。ルーンの上にいると、攻撃力が18%アップする。(クールタイム: 15秒)", "only": null}, {"key": "防具|超自然+", "part": "防具", "name": "超自然+", "cls": null, "tiers": [6], "text": "スキル使用または通常攻撃時、55%の確率で5秒間、キャスト及びチャージ速度が25%アップする。", "only": null}, {"key": "防具|連勝", "part": "防具", "name": "連勝", "cls": null, "tiers": [6], "text": "フィニッシュアタック命中時、次の攻撃がターゲット周辺3m以内にいる敵にダメージの30％の持続ダメージ:傷を付与する。(クールタイム: 1秒)", "only": null}, {"key": "防具|銀色の尖塔", "part": "防具", "name": "銀色の尖塔", "cls": null, "tiers": [6], "text": "味方のHPを回復させると15秒間、与ダメージが5%アップする。該当の効果は最大3回まで重複する。(クールタイム: 5秒)", "only": null}, {"key": "防具|防護+", "part": "防具", "name": "防護+", "cls": null, "tiers": [6], "text": "被持続ダメージが○ダウンする。", "only": null}, {"key": "防具|降り注ぐ火炎", "part": "防具", "name": "降り注ぐ火炎", "cls": null, "uniq": "破滅のルーン", "pair": "燃え上がる心臓", "tiers": [6], "text": "攻撃命中時、ターゲットに炎の塊を発射し、威力320%のダメージを与え、5秒間持続する火炎エリアを作る。\n火炎エリアは1秒ごとに威力175%のダメージを与える。燃え上がる心臓の刻印を保有中の場合、炎の塊を合計3個発射する。\n(クールタイム: 10秒)", "only": null}, {"key": "防具|静かな風", "part": "防具", "name": "静かな風", "cls": null, "tiers": [6], "text": "周辺3m範囲内に敵がいない場合、与ダメージが13%アップする。(弓使い系クラス専用)", "only": "弓使い系"}, {"key": "防具|非情な勝負師", "part": "防具", "name": "非情な勝負師", "cls": null, "tiers": [6], "text": "持続ダメージ:中毒、傷を保有中の敵への与ダメージが○アップし、敵に与えるノーガードダメージが5%アップする。(盗賊系クラス専用)", "only": "盗賊系"}, {"key": "防具|飢えた刃", "part": "防具", "name": "飢えた刃", "cls": null, "uniq": "神聖のルーン", "pair": "巨人の腕", "tiers": [6], "text": "攻撃時、前方の敵に威力380%のダメージと威力350%の持続ダメージ:傷を付与し、移動速度が30%ダウンする弱体化効果:拘束の刃を付与する。\n弱体化効果:破壊された鎧を保有中の敵には2倍の直接ダメージを与える。(クールタイム: 8秒)", "only": null}, {"key": "防具|黒い炎", "part": "防具", "name": "黒い炎", "cls": null, "tiers": [6], "text": "クロス攻撃命中時、3m以内にいる敵に威力680%の持続ダメージ:火傷を付与する。カウンター攻撃時、ターゲットに威力870%の持続ダメージ:恐怖を付与する。(クールタイム:各3秒)", "only": null}, {"key": "防具|黒い誓約", "part": "防具", "name": "黒い誓約", "cls": null, "tiers": [6], "text": "攻撃命中時、自身の位置に10秒間維持される保護のルーンを作る。ルーンの上にいると、被ダメージが18%ダウンする。(クールタイム: 15秒)", "only": null}, {"key": "防具|乱闘", "part": "防具", "name": "乱闘", "cls": null, "tiers": [5], "text": "自身の周辺5m以内にいる敵の数に応じて被ダメージが最大12%までダウンする。", "only": null}, {"key": "防具|侵食", "part": "防具", "name": "侵食", "cls": null, "tiers": [5], "text": "持続ダメージ:絶望が付与されている敵を攻撃時、自身が付与した弱体化効果の数に応じて威力320%/威力400%/威力600%のダメージを与える。(クールタイム: 5秒)", "only": null}, {"key": "防具|凍結", "part": "防具", "name": "凍結", "cls": null, "tiers": [5], "text": "持続ダメージ:氷結が付与されている敵を攻撃時、5秒後に威力400%の追加ダメージを与える。(クールタイム: 5秒)", "only": null}, {"key": "防具|初期", "part": "防具", "name": "初期", "cls": null, "tiers": [5], "text": "戦闘開始時、30秒間、攻撃力が16%アップする。", "only": null}, {"key": "防具|吸血", "part": "防具", "name": "吸血", "cls": null, "tiers": [5], "text": "持続ダメージ:傷を保有中の敵を攻撃時、8秒間、攻撃力が12%アップする。(クールタイム: 12秒)", "only": null}, {"key": "防具|圧倒", "part": "防具", "name": "圧倒", "cls": null, "tiers": [5], "text": "ノーガード攻撃命中時、ターゲットに威力310%の持続ダメージ:感電を追加で付与する。(クールタイム: 1秒)", "only": null}, {"key": "防具|城塞", "part": "防具", "name": "城塞", "cls": null, "tiers": [5], "text": "HPが75%以上の場合、被ダメージが8%ダウンする。", "only": null}, {"key": "防具|奇襲", "part": "防具", "name": "奇襲", "cls": null, "tiers": [5], "text": "カウンター攻撃命中時、3秒間、攻撃力が16%アップする。", "only": null}, {"key": "防具|威嚇", "part": "防具", "name": "威嚇", "cls": null, "tiers": [5], "text": "フィニッシュアタック命中時、周辺3m以内にいる全ての敵に威力90%のダメージと威力530%の持続ダメージ:絶望を付与し、脅かして逃走させる。", "only": null}, {"key": "防具|安定", "part": "防具", "name": "安定", "cls": null, "tiers": [5], "text": "HPが75%以上の場合、攻撃力が9%アップする。", "only": null}, {"key": "防具|戦術家", "part": "防具", "name": "戦術家", "cls": null, "tiers": [5], "text": "強打、連打、ノーガード、カウンター攻撃時、10秒間、攻撃力が2.5％アップし、該当の効果は最大4回まで重複する。(クールタイム:各5秒)", "only": null}, {"key": "防具|暴風", "part": "防具", "name": "暴風", "cls": null, "tiers": [5], "text": "ノーガード攻撃命中時、5秒間、スキル使用速度及び攻撃速度が32%アップする。", "only": null}, {"key": "防具|根性", "part": "防具", "name": "根性", "cls": null, "tiers": [5], "text": "敵からダメージを受けてHPが50%以下になると、10秒間、被ダメージが24%ダウンする。(クールタイム: 30秒)", "only": null}, {"key": "防具|欠如", "part": "防具", "name": "欠如", "cls": null, "tiers": [5], "text": "保有中のリソ ], "text": "", "only": null}, {"key": "防具|弱体化", "part": "防具", "name": "弱体化", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|暴走", "part": "防具", "name": "暴走", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|死活", "part": "防具", "name": "死活", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|激流", "part": "防具", "name": "激流", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|警戒", "part": "防具", "name": "警戒", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|開始", "part": "防具", "name": "開始", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|闘争", "part": "防具", "name": "闘争", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|障壁", "part": "防具", "name": "障壁", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "防具|飢餓", "part": "防具", "name": "飢餓", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "エンブレム|冷酷", "part": "エンブレム", "name": "冷酷", "cls": null, "tiers": [6], "text": "攻撃がクリティカルで命中しない度にクリティカル率が12%アップする。アップしたクリティカル率はクリティカル命中時にリセットされる。", "only": null}, {"key": "エンブレム|女神の加護", "part": "エンブレム", "name": "女神の加護", "cls": null, "tiers": [6], "text": "戦闘開始時及び究極技を使用時、30秒間、与ダメージが25%アップする。", "only": null}, {"key": "エンブレム|女神の権能", "part": "エンブレム", "name": "女神の権能", "cls": null, "tiers": [6], "text": "味方のHPを回復させると、対象と自身の攻撃力が12秒間、13%アップする。\n同時に2人以上回復させる場合、該当の効果は1人にのみ適用される。(クールタイム: 9秒)", "only": null}, {"key": "エンブレム|強堅+", "part": "エンブレム", "name": "強堅+", "cls": null, "tiers": [6], "text": "攻撃命中時、戦闘終了時まで15秒ごとに攻撃力と防御力が1%アップし、該当の効果は最大10回まで重複する。", "only": null}, {"key": "エンブレム|強烈+", "part": "エンブレム", "name": "強烈+", "cls": null, "tiers": [6], "text": "連打命中時、5秒間、敵に与える強打ダメージが18%アップする。(クールタイム: 10秒)", "only": null}, {"key": "エンブレム|狂暴+", "part": "エンブレム", "name": "狂暴+", "cls": null, "tiers": [6], "text": "敵に与えるブレイクダメージが30%アップし、ノーガードダメージが18%アップする。", "only": null}, {"key": "エンブレム|瞬速+", "part": "エンブレム", "name": "瞬速+", "cls": null, "tiers": [6], "text": "強打命中時、5秒間、敵に与える連打ダメージが18%アップする。(クールタイム: 10秒)", "only": null}, {"key": "エンブレム|知恵", "part": "エンブレム", "name": "知恵", "cls": null, "tiers": [6], "text": "全てのスキルのクールタイムが18%ダウンする。", "only": null}, {"key": "エンブレム|絢爛", "part": "エンブレム", "name": "絢爛", "cls": null, "tiers": [6], "text": "クリティカル率が10%アップし、敵に与えるクリティカルダメージが30%アップする。", "only": null}, {"key": "エンブレム|強堅", "part": "エンブレム", "name": "強堅", "cls": null, "tiers": [5], "text": "攻撃命中時、戦闘終了時まで15秒ごとに攻撃力と防御力が0.8％アップし、該当の効果は最大10回まで重複する。", "only": null}, {"key": "エンブレム|強烈", "part": "エンブレム", "name": "強烈", "cls": null, "tiers": [5], "text": "連打命中時、5秒間、敵に与える強打ダメージが15%アップする。(クールタイム: 10秒)", "only": null}, {"key": "エンブレム|狂暴", "part": "エンブレム", "name": "狂暴", "cls": null, "tiers": [5], "text": "敵に与えるブレイクダメージが30%アップする。", "only": null}, {"key": "エンブレム|瞬速", "part": "エンブレム", "name": "瞬速", "cls": null, "tiers": [5], "text": "強打命中時、5秒間、敵に与える連打ダメージが15%アップする。(クールタイム: 10秒)", "only": null}, {"key": "エンブレム|乱暴", "part": "エンブレム", "name": "乱暴", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "エンブレム|強力", "part": "エンブレム", "name": "強力", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "エンブレム|強靭", "part": "エンブレム", "name": "強靭", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "エンブレム|機敏", "part": "エンブレム", "name": "機敏", "cls": null, "tiers": [4], "text": "", "only": null}, {"key": "アクセ|氷結術師|オーロラ", "part": "アクセ", "name": "オーロラ", "cls": "氷結術師", "tiers": [5, 6], "text": "氷結術師のフローズンオーブをフローズングローブに切り替える。\n凍りついた球体を爆発させて範囲ダメージを与え、氷のベールを作って味方を保護する。", "only": null}, {"key": "アクセ|楽師|二重奏", "part": "アクセ", "name": "二重奏", "cls": "楽師", "tiers": [4, 6], "text": "楽師の技巧:クレッシェンドを変化させる。\nクールタイムが小幅にアップする代わりに、最大スタック数が1アップする。", "only": null}, {"key": "アクセ|大剣戦士|会心", "part": "アクセ", "name": "会心", "cls": "大剣戦士", "tiers": [4, 6], "text": "大剣戦士の大剣術を変化させる。\n大剣術使用時、チャージ段階に応じてアップされたクリティカル率を獲得し、敵が一定HP以下の場合、クリティカル率が2倍にアップする。", "only": null}, {"key": "アクセ|弓使い|俊敏", "part": "アクセ", "name": "俊敏", "cls": "弓使い", "tiers": [4, 6], "text": "弓使いのサイドステップを変化させる。\nサイドステップ使用時、急所回避及び移動速度アップ効果が適用される。", "only": null}, {"key": "アクセ|ヒーラー|光群", "part": "アクセ", "name": "光群", "cls": "ヒーラー", "tiers": [5, 6], "text": "ヒーラーのサモンルミナスを変化させる。\nヒーラーとライフリンクで繋がったターゲットの位置に一定時間戦闘をサポートする光の結晶を召喚する。", "only": null}, {"key": "アクセ|司祭|光芒", "part": "アクセ", "name": "光芒", "cls": "司祭", "tiers": [5, 6], "text": "司祭のホーリースピアをピアスライトに切り替える。\n小さな光の槍を放ち、直線上の全ての敵を貫通する。", "only": null}, {"key": "アクセ|修道士|光輝", "part": "アクセ", "name": "光輝", "cls": "修道士", "tiers": [4, 6], "text": "修道士の化身を変化させる。\nクールタイムと持続時間が大幅にダウンし、化身が発動すると修道士が強烈な光を放って周辺の全ての敵にダメージを与える。", "only": null}, {"key": "アクセ|楽師|共鳴", "part": "アクセ", "name": "共鳴", "cls": "楽師", "tiers": [4, 6], "text": "楽師の演奏:アルペジオを変化させる。\n弱体化効果:幻惑の持続ダメージが最大8回まで重複する。", "only": null}, {"key": "アクセ|ロングボウ使い|内傷", "part": "アクセ", "name": "内傷", "cls": "ロングボウ使い", "tiers": [4, 6], "text": "ロングボウ使いのシェルブレイカーを変化させる。\nスキル攻撃時、持続ダメージ:傷を付与する弱体化効果:内傷効果が追加される。", "only": null}, {"key": "アクセ|氷結術師|冬", "part": "アクセ", "name": "冬", "cls": "氷結術師", "tiers": [4, 6], "text": "氷結術師のフリージングフィールドを変化させる。\n一定時間1秒ごとにダメージがアップする。", "only": null}, {"key": "アクセ|大剣戦士|切断", "part": "アクセ", "name": "切断", "cls": "大剣戦士", "tiers": [4, 6], "text": "大剣戦士のスピニングスラッシュを変化させる。\nスキルのクールタイムとダメージ、最大スタック数がアップする。", "only": null}, {"key": "アクセ|格闘家|前進", "part": "アクセ", "name": "前進", "cls": "格闘家", "tiers": [4, 6], "text": "格闘家のスラストキックを変化させる。\n突進スキルに変更され、最後のチェーンスキル、コンボスキルダメージがアップする。", "only": null}, {"key": "アクセ|ヒーラー|包容", "part": "アクセ", "name": "包容", "cls": "ヒーラー", "tiers": [4, 6], "text": "ヒーラーのプロテクションを変化させる。\nしばらく被ダメージが追加でダウンする。", "only": null}, {"key": "アクセ|氷結術師|北風", "part": "アクセ", "name": "北風", "cls": "氷結術師", "tiers": [4, 6], "text": "氷結術師のグレイシアカッターを変化させる。\nグレイシアカッターのスキル使用速度と使用可能回数がアップし、クールタイムがダウンする。", "only": null}, {"key": "アクセ|楽師|博愛", "part": "アクセ", "name": "博愛", "cls": "楽師", "tiers": [4, 6], "text": "楽師の演奏:セレナーデを変化させる。\n前方の全ての敵を魅惑する。クレッシェンドに強化時、威力が大幅にアップする。", "only": null}, {"key": "アクセ|吟遊詩人|即興", "part": "アクセ", "name": "即興", "cls": "吟遊詩人", "tiers": [4, 6], "text": "吟遊詩人のバーズテイルを変化させる。\n浮かんでくる楽想がない場合、不協和音を出す変則的な演奏で周辺の全ての敵に大きなダメージを与える。", "only": null}, {"key": "アクセ|大剣戦士|反撃", "part": "アクセ", "name": "反撃", "cls": "大剣戦士", "tiers": [5, 6], "text": "大剣戦士のライジングスマッシュを変化させる。\nスキルチャージが可能になり、更に大きなダメージを与える。\nチャージ中に被ダメージ時、チャージ段階が最大に達する。ブレイクダメージを受けた場合は、更に強力なブレイクダメージで反撃する。\nまた、2倍アップした強化効果:不屈が付与される。", "only": null}, {"key": "アクセ|クロスボウ使い|反転", "part": "アクセ", "name": "反転", "cls": "クロスボウ使い", "tiers": [4, 6], "text": "クロスボウ使いのスライディングステップを変化させる。\n前方に滑りながら、強化ボルト弾倉を1回に2個装填する。", "only": null}, {"key": "アクセ|戦士|咆哮", "part": "アクセ", "name": "咆哮", "cls": "戦士", "tiers": [4, 6], "text": "戦士の戦場の雄叫びを変化させる。\n闘志が最高値に達すると、味方に付与するダメージアップ効果が強化され、周辺の全ての敵を薙ぎ払う非常に強力な衝撃波を引き起こす。", "only": null}, {"key": "アクセ|吟遊詩人|和音", "part": "アクセ", "name": "和音", "cls": "吟遊詩人", "tiers": [5, 6], "text": "吟遊詩人のトリプルストロークを変化させる。\n浮かんでくる楽想に応じて3曲の中から1曲を演奏し、追加効果が適用される。", "only": null}, {"key": "アクセ|ダンサー|喝采", "part": "アクセ", "name": "喝采", "cls": "ダンサー", "tiers": [5, 6], "text": "ダンサーのアドリブを変化させる。\n一定範囲内にいる味方にスキル攻撃時、追加攻撃効果を付与する。", "only": null}, {"key": "アクセ|吟遊詩人|嘲弄", "part": "アクセ", "name": "嘲弄", "cls": "吟遊詩人", "tiers": [5, 6], "text": "吟遊詩人のメロディーショックを変化させる。\nメロディーショック使用時、\n勝戦の演奏をする勝利のセレモニーを\n1回使用できる。", "only": null}, {"key": "アクセ|火炎術師|噴出", "part": "アクセ", "name": "噴出", "cls": "火炎術師", "tiers": [4, 6], "text": "火炎術師のフラッシュオーバーを変化させる。\nスキル発動中は熱気を30消費する度にスキルの持続時間が1秒アップする。\n持続時間がアップする時に1回だけ追加で火炎の波動を放つ｡", "only": null}, {"key": "アクセ|大剣戦士|回転", "part": "アクセ", "name": "回転", "cls": "大剣戦士", "tiers": [4, 6], "text": "大剣戦士のスピニングスラッシュを変化させる。\n回転数が上がり、敵を斬る回数が増える。\n使用時間とクールタイムが大幅にアップする。", "only": null}, {"key": "アクセ|修道士|因果", "part": "アクセ", "name": "因果", "cls": "修道士", "tiers": [4, 6], "text": "修道士の殺到を変化させる。\n発動している真言が多いほど連打回数がアップする。\n更に、殺到を通常攻撃扱いとし、攻撃速度の影響を受けるようになる。", "only": null}, {"key": "アクセ|剣術士|圧迫", "part": "アクセ", "name": "圧迫", "cls": "剣術士", "tiers": [4, 6], "text": "剣術士の鞘アタックを変化させる。\n鞘アタックまたは秘剣:鞘アタックの攻撃が敵の周辺に影響を与える範囲ダメージに強化される。", "only": null}, {"key": "アクセ|魔法使い|増幅", "part": "アクセ", "name": "増幅", "cls": "魔法使い", "tiers": [4, 6], "text": "魔法使いのマナストームを変化させる。\nエレメンタルハーモニーが一定時間発動し、エレメンタル持続ダメージがアップする。", "only": null}, {"key": "アクセ|盗賊|夕闇", "part": "アクセ", "name": "夕闇", "cls": "盗賊", "tiers": [5, 6], "text": "盗賊の隠密を変化させる。\n隠密使用時、隠密を除外したスキルのクールタイムがダウンする。", "only": null}, {"key": "アクセ|クロスボウ使い|妨害", "part": "アクセ", "name": "妨害", "cls": "クロスボウ使い", "tiers": [4, 6], "text": "クロスボウ使いのスライディングステップを変化させる。\n前方の広い範囲にボルトを発射し、複数の敵に更に大きなダメージを与える。", "only": null}, {"key": "アクセ|魔法使い|山崩れ", "part": "アクセ", "name": "山崩れ", "cls": "魔法使い", "tiers": [4, 6], "text": "魔法使いのテレキネシスを変化させる。\n岩の破片をターゲットに乱射してダメージを与え、一定時間敵に与える元素ダメージがアップする。", "only": null}, {"key": "アクセ|ロングボウ使い|崩落", "part": "アクセ", "name": "崩落", "cls": "ロングボウ使い", "tiers": [4, 6], "text": "ロングボウ使いのクラッシュショットを変化させる。\nスキルダメージがアップし、カウンターで命中時、対象をブレイクさせる。", "only": null}, {"key": "アクセ|デュアルブレイド|強化", "part": "アクセ", "name": "強化", "cls": "デュアルブレイド", "tiers": [4, 6], "text": "デュアルブレイドのハウリングゲイル、ハウリングテンペストを変化させる。\n強化スキル使用時、ハウリングゲイル、ハウリングテンペストダメージがアップする。", "only": null}, {"key": "アクセ|大剣戦士|弾力", "part": "アクセ", "name": "弾力", "cls": "大剣戦士", "tiers": [5, 6], "text": "大剣戦士のスラッシュを変化させる。\nスキルチャージが可能になり、更に大きなダメージを与える。\nスラッシュ使用時、チャージ段階に応じて弾力効果が適用される。\nスラッシュを除外したチャージスキル使用時、弾力効果を消費することでチャージ段階がアップする。", "only": null}, {"key": "アクセ|修道士|応報", "part": "アクセ", "name": "応報", "cls": "修道士", "tiers": [5, 6], "text": "修道士の霹靂打を変化させる。\n力、光、浄化の真言を全て発動させると10秒間霹靂掌を1回使用できる。", "only": null}, {"key": "アクセ|吟遊詩人|急襲", "part": "アクセ", "name": "急襲", "cls": "吟遊詩人", "tiers": [4, 6], "text": "吟遊詩人のストリングショットを変化させる。\nストリングショット使用時、しばらくスキル使用速度がアップし、演奏スキルに続けて使用すると、追加でストリングショットのクールタイムがフィーバー段階に応じてダウンする。", "only": null}, {"key": "アクセ|ダンサー|情熱", "part": "アクセ", "name": "情熱", "cls": "ダンサー", "tiers": [4, 6], "text": "ダンサーのウィンドミルを変化させる。\nウィンドミル使用時、敵に持続ダメージを与え、該当の効果は情熱タイプのスキルで持続時間が延長される。", "only": null}, {"key": "アクセ|クロスボウ使い|感電", "part": "アクセ", "name": "感電", "cls": "クロスボウ使い", "tiers": [4, 6], "text": "クロスボウ使いのショックエクスプロージョンを変化させる。\n電気属性が注入されたボルトで敵に持続ダメージ:感電を付与し、一定時間クリティカル率がアップする。", "only": null}, {"key": "アクセ|大剣戦士|憤怒", "part": "アクセ", "name": "憤怒", "cls": "大剣戦士", "tiers": [4, 6], "text": "大剣戦士のストンプとショルダーアタックを変化させる。\nショルダーアタック使用時、戦闘のテンポがアップする。\nストンプの場合、ブレイクダメージが追加される。", "only": null}, {"key": "アクセ|ヒーラー|抑圧", "part": "アクセ", "name": "抑圧", "cls": "ヒーラー", "tiers": [5, 6], "text": "ヒーラーのファントムペインを変化させる。\n生命力を凝縮させた魔力の球体が敵と味方の間を移動しながら数回に渡って爆発を引き起こす。", "only": null}, {"key": "アクセ|盗賊|投擲", "part": "アクセ", "name": "投擲", "cls": "盗賊", "tiers": [4, 6], "text": "盗賊のスローイングボムを変化させる。\n盗賊のスキルがクリティカルで適用される場合、スローイングボムのクールタイムがダウンする。", "only": null}, {"key": "アクセ|ダンサー|接近", "part": "アクセ", "name": "接近", "cls": "ダンサー", "tiers": [4, 6], "text": "ダンサーのフロントステップを変化させる。\nフロントステップで移動した距離に応じてクールタイムがダウンする。", "only": null}, {"key": "アクセ|格闘家|撃破", "part": "アクセ", "name": "撃破", "cls": "格闘家", "tiers": [5, 6], "text": "格闘家のバーストパンチを変化させる。\nバーストパンチ命中時、周辺に他の敵がいない場合、ターゲットに追加攻撃を与える。", "only": null}, {"key": "アクセ|戦士|斬撃", "part": "アクセ", "name": "斬撃", "cls": "戦士", "tiers": [4, 6], "text": "戦士のブレイドスマッシュを変化させる。\n常に周辺の円形の範囲にいる敵を素早く攻撃し、追加で持続ダメージ:火傷を付与する。\n攻撃した敵の数に応じてダメージがアップする。", "only": null}, {"key": "アクセ|デュアルブレイド|旋風", "part": "アクセ", "name": "旋風", "cls": "デュアルブレイド", "tiers": [5, 6], "text": "デュアルブレイドのスクリューラッシュを\n3960ハリケーンに切り替える。", "only": null}, {"key": "アクセ|ロングボウ使い|根気", "part": "アクセ", "name": "根気", "cls": "ロングボウ使い", "tiers": [4, 6], "text": "ロングボウ使いのウィングスキュアを変化させる。\n投槍支援攻撃がターゲットを中心に3回に渡って行われ、合計ダメージが小幅にアップする。", "only": null}, {"key": "アクセ|修道士|業火", "part": "アクセ", "name": "業火", "cls": "修道士", "tiers": [5, 6], "text": "修道士の治癒を業火に切り替える。\n神聖力を全て消費し、ターゲットにダメージを与え、周辺の味方を回復させる。", "only": null}, {"key": "アクセ|吟遊詩人|機転", "part": "アクセ", "name": "機転", "cls": "吟遊詩人", "tiers": [4, 6], "text": "吟遊詩人の死んだフリを食らったフリに切り替える。\n後方に退きながら敵に奇襲をかけ、楽想:反撃を浮かべる。", "only": null}, {"key": "アクセ|吟遊詩人|欺瞞", "part": "アクセ", "name": "欺瞞", "cls": "吟遊詩人", "tiers": [4, 6], "text": "吟遊詩人のライジングウィンドミルをサプライズショットに切り替える。\nダウン状態の場合、直ちに起き上がって周辺の敵に特殊弾を発射し、弱体化させる。\n追加で、ファインチューニングのダメージと究極技ゲージ獲得量がアップする。", "only": null}, {"key": "アクセ|盗賊|毒性", "part": "アクセ", "name": "毒性", "cls": "盗賊", "tiers": [4, 6], "text": "盗賊のスローイングボムを変化させる。\n爆発属性が毒属性に変更され、持続ダメージ:中毒を付与する。", "only": null}, {"key": "アクセ|盗賊|毒霧", "part": "アクセ", "name": "毒霧", "cls": "盗賊", "tiers": [5, 6], "text": "盗賊のポイズントラップを変化させる。\n毒霧は一定時間自身に付いて回り、範囲内にいる敵に持続ダメージ:中毒を付与する。\n毒エリア内では自身の急所回避がアップする。", "only": null}, {"key": "アクセ|氷結術師|氷剣", "part": "アクセ", "name": "氷剣", "cls": "氷結術師", "tiers": [5, 6], "text": "氷結術師のクリスタルエッジを変化させる。\n霜を一定量生成する度に霜剣を獲得し、霜剣を一定値以上集めるとクリスタルソードに強化される。", "only": null}, {"key": "アクセ|氷結術師|氷柱", "part": "アクセ", "name": "氷柱", "cls": "氷結術師", "tiers": [4, 6], "text": "氷結術師のアイススパイクを変化させる。\nHPが一定値以下になると、リソース消費とクールタイムなしでアイススパイクを自動的に発動できる。", "only": null}, {"key": "アクセ|ヒーラー|波", "part": "アクセ", "name": "波", "cls": "ヒーラー", "tiers": [4, 6], "text": "ヒーラーの生命の鼓動を変化させる。\n最大スタック数がアップし、更に多くの味方と敵にそれぞれ治癒またはダメージを与える。\nまた、生命の鼓動によるライフリンクの効果を転移時、周辺の味方に付与する強化効果の威力がアップする。", "only": null}, {"key": "アクセ|修道士|浄化", "part": "アクセ", "name": "浄化", "cls": "修道士", "tiers": [4, 6], "text": "修道士の守護陣を変化させる。\nバリアを作る時、味方の属性持続ダメージを全て解除する。", "only": null}, {"key": "アクセ|ダンサー|清爽", "part": "アクセ", "name": "清爽", "cls": "ダンサー", "tiers": [4, 6], "text": "ダンサーのピルエットを変化させる。\nピルエットで強化された遠距離攻撃ダメージが一定回数の間アップし、該当の効果の保有中は攻撃速度がアップする。また、強化された通常攻撃が命中した敵は一定時間更に大きなダメージを受ける。", "only": null}, {"key": "アクセ|デュアルブレイド|満月", "part": "アクセ", "name": "満月", "cls": "デュアルブレイド", "tiers": [4, 6], "text": "デュアルブレイドのダブルクレセント、ライジングクレセントを変化させる。\nブレイク状態の敵に使用時、ダブルクレセントのクールタイムがリセットされる。\nクールタイムリセット効果は一定時間ごとに1回のみ発動する。", "only": null}, {"key": "アクセ|火炎術師|火力", "part": "アクセ", "name": "火力", "cls": "火炎術師", "tiers": [4, 6], "text": "火炎術師のフレイムキャノンを変化させる。\n熱気が50以上の場合、5の熱気を消費して強化型で使用する。", "only": null}, {"key": "アクセ|火炎術師|火柱", "part": "アクセ", "name": "火柱", "cls": "火炎術師", "tiers": [4, 6], "text": "火炎術師のファイアストームを変化させる。\nスキルが発動すると直ちに爆発ダメージを与え、スキルを準備中の敵は空中に高く浮かされる。\n威力がダウンする代わりに、スキル連続使用回数がアップし、クールタイムがダウンする。", "only": null}, {"key": "アクセ|火炎術師|火種", "part": "アクセ", "name": "火種", "cls": "火炎術師", "tiers": [5, 6], "text": "火炎術師のラピッドファイアを変化させる。\n複数の火炎球を同時に発射し、前方の全ての敵にダメージを与える。\nクールタイムがアップするが、攻撃範囲と熱気生成量がアップする。", "only": null}, {"key": "アクセ|クロスボウ使い|火薬", "part": "アクセ", "name": "火薬", "cls": "クロスボウ使い", "tiers": [5, 6], "text": "クロスボウ使いのバスターショットを変化させる。\nスキル使用時、一定時間火炎属性の与ダメージがアップする。", "only": null}, {"key": "アクセ|火炎術師|灰の山", "part": "アクセ", "name": "灰の山", "cls": "火炎術師", "tiers": [5, 6], "text": "火炎術師のエクスプロージョンをクロスファイアに切り替える。\n周辺の火の手を直ちに爆発させずに、火炎球の形に凝縮してターゲットに向けて発射する。", "only": null}, {"key": "アクセ|魔法使い|点滅", "part": "アクセ", "name": "点滅", "cls": "魔法使い", "tiers": [4, 6], "text": "魔法使いのマナストームを変化させる。\nターゲットの位置に瞬間移動し、荒々しいマナの暴風で周辺の敵に範囲ダメージを与えると同時に一定のマナを直ちに回復し、マナシールドを獲得する。\nスキルを再使用時、マナシールドの爆発を引き起こし、周辺の敵に範囲ダメージを与え、直ちに後方に移動する。", "only": null}, {"key": "アクセ|デュアルブレイド|熱傷", "part": "アクセ", "name": "熱傷", "cls": "デュアルブレイド", "tiers": [4, 6], "text": "デュアルブレイドのスプリットスラッシュ、スプリットダウンを変化させる。\n攻撃時、剣気を放って前方に範囲ダメージを与える。\nスキルクールタイムがダウンする。", "only": null}, {"key": "アクセ|格闘家|熱血", "part": "アクセ", "name": "熱血", "cls": "格闘家", "tiers": [4, 6], "text": "格闘家のサマーソルトを変化させる。\n足に込めた火炎のオーラを刃の形で放ち、前方の敵に範囲ダメージを与える。", "only": null}, {"key": "アクセ|火炎術師|熱風", "part": "アクセ", "name": "熱風", "cls": "火炎術師", "tiers": [4, 6], "text": "火炎術師のファイアストームを変化させる。\n火の渦巻きの持続時間とダメージが大幅にアップし、ダメージを与えた敵の数に応じて熱気を生成する。", "only": null}, {"key": "アクセ|司祭|犠牲", "part": "アクセ", "name": "犠牲", "cls": "司祭", "tiers": [4, 6], "text": "司祭のサンクチュアリを変化させる。\n2倍のHPを消費し、2倍の神聖力持続回復効果と、更に強力な回復効果を提供する強化された聖域を生成する。", "only": null}, {"key": "アクセ|盗賊|狡猾", "part": "アクセ", "name": "狡猾", "cls": "盗賊", "tiers": [4, 6], "text": "盗賊のスクリューダガーを変化させる。\n攻撃範囲がアップし、オーバーチャージが3段階までアップする。", "only": null}, {"key": "アクセ|弓使い|猛威", "part": "アクセ", "name": "猛威", "cls": "弓使い", "tiers": [4, 6], "text": "弓使いのマグナムショットを変化させる。\n風を最大値まで獲得し、しばらく与ダメージがアップする。\nクールタイムがアップする。", "only": null}, {"key": "アクセ|戦士|猛攻", "part": "アクセ", "name": "猛攻", "cls": "戦士", "tiers": [5, 6], "text": "戦士のラピッドスラッシュを変化させる。\nガード状態の場合、敵に猛烈な連続攻撃を行い、しばらく攻撃力がアップする制圧に変化する。", "only": null}, {"key": "アクセ|剣術士|猛烈", "part": "アクセ", "name": "猛烈", "cls": "剣術士", "tiers": [4, 6], "text": "剣術士の看破を変化させる。\n看破に成功した場合、一定時間剣術士が敵に追加ダメージを与える。", "only": null}, {"key": "アクセ|デュアルブレイド|疾走", "part": "アクセ", "name": "疾走", "cls": "デュアルブレイド", "tiers": [5, 6], "text": "デュアルブレイドのグライディングフューリー、ライトニングフューリーを変化させる。\nライトニングフューリー使用時、グライディングフューリーのクールタイムをリセットし、34％の確率で疾風リソースを1個追加で獲得する。", "only": null}, {"key": "アクセ|格闘家|瞬発力", "part": "アクセ", "name": "瞬発力", "cls": "格闘家", "tiers": [4, 6], "text": "格闘家のバックステップを変化させる。\nバックステップで敵にダメージを与えると、敵の移動速度がダウンする。", "only": null}, {"key": "アクセ|氷結術師|破片", "part": "アクセ", "name": "破片", "cls": "氷結術師", "tiers": [4, 6], "text": "氷結術師のアイススパイクを変化させる。\nアイススパイクが発動した状態で被ダメージ時、反撃ダメージと効果終了時の爆発ダメージがアップする。", "only": null}, {"key": "アクセ|ロングボウ使い|破砕", "part": "アクセ", "name": "破砕", "cls": "ロングボウ使い", "tiers": [4, 6], "text": "ロングボウ使いのシェルブレイカーを変化させる。\nシェルブレイカーの攻撃を受けたターゲットの周辺に衝撃波が発生し、範囲ダメージを与える。\n範囲ダメージを受けた敵の被ダメージがアップする。", "only": null}, {"key": "アクセ|戦士|突撃", "part": "アクセ", "name": "突撃", "cls": "戦士", "tiers": [5, 6], "text": "戦士の突きを貫きに切り替える。\n全ての力を切っ先に集め、ターゲットに強力な突進攻撃を行う。", "only": null}, {"key": "アクセ|戦士|突進", "part": "アクセ", "name": "突進", "cls": "戦士", "tiers": [4, 6], "text": "戦士のシールドラッシュを変化させる。\n短い距離を突進して敵を攻撃し、スキル準備中の敵には2倍のダメージを与える。\nブレイク状態でも使用できる。", "only": null}, {"key": "アクセ|ダンサー|簡潔", "part": "アクセ", "name": "簡潔", "cls": "ダンサー", "tiers": [4, 6], "text": "ダンサーのピルエットを変化させる。\nピルエット使用後、次のスキルの与ダメージがアップする。", "only": null}, {"key": "アクセ|弓使い|素早さ", "part": "アクセ", "name": "素早さ", "cls": "弓使い", "tiers": [4, 6], "text": "弓使いのマグナムショットを変化させる。\n直ちに跳躍し、ターゲット周辺の敵をスタンさせる強力な矢を発射する。マグナムショットの最大スタック数がアップする。", "only": null}, {"key": "アクセ|楽師|終章", "part": "アクセ", "name": "終章", "cls": "楽師", "tiers": [5, 6], "text": "楽師の技巧:クライマックスを変化させる。\n単一ターゲットスキルに変更され、ターゲットに付与された弱体化効果に応じてダメージがアップする。", "only": null}, {"key": "アクセ|司祭|結束", "part": "アクセ", "name": "結束", "cls": "司祭", "tiers": [4, 6], "text": "司祭のサモンリンカーを変化させる。\nリンカーが連結対象に応じて回復させるか、またはダメージを与えると、神聖力を一部回復する。\nサモンリンカー以外のスキルを使用すると、20％の確率でリンカーが再発動する。", "only": null}, {"key": "アクセ|デュアルブレイド|続行", "part": "アクセ", "name": "続行", "cls": "デュアルブレイド", "tiers": [4, 6], "text": "デュアルブレイドのハウリングゲイル、ハウリングテンペストを変化させる。\nスキル使用中に究極技を除外したアクティブスキルのクールタイム回復速度がアップする。", "only": null}, {"key": "アクセ|盗賊|緻密", "part": "アクセ", "name": "緻密", "cls": "盗賊", "tiers": [4, 6], "text": "盗賊の奇襲を変化させる。\nオーバーチャージの段階に応じて奇襲に適用されるクリティカル率がアップする。", "only": null}, {"key": "アクセ|司祭|翼", "part": "アクセ", "name": "翼", "cls": "司祭", "tiers": [5, 6], "text": "司祭のディヴァインウィングをヘブンズドアに切り替える。\n鳥の形をした光の群れを一定の周期で発散する魔法陣を召喚する。\n対象に応じて回復させるか、またはダメージを与える。神聖力を消費すると回復量がアップする。", "only": null}, {"key": "アクセ|修道士|聖別", "part": "アクセ", "name": "聖別", "cls": "修道士", "tiers": [4, 6], "text": "修道士の化身を変化させる。\n化身の効果持続中に回復力がアップする。", "only": null}, {"key": "アクセ|司祭|聖殿", "part": "アクセ", "name": "聖殿", "cls": "司祭", "tiers": [4, 6], "text": "司祭のサンクチュアリを変化させる。\n聖域内にいる間、司祭の全ての神聖力消費スキルのダメージがアップする。", "only": null}, {"key": "アクセ|楽師|胸声", "part": "アクセ", "name": "胸声", "cls": "楽師", "tiers": [5, 6], "text": "楽師のスキル演奏:星のソナタを演奏:混沌の夜想曲に切り替える。", "only": null}, {"key": "アクセ|弓使い|脱出", "part": "アクセ", "name": "脱出", "cls": "弓使い", "tiers": [4, 6], "text": "弓使いのエスケープステップを変化させる。\nブレイク状態でもエスケープステップを使用でき、自身のブレイク状態を解除する。", "only": null}, {"key": "アクセ|弓使い|致命", "part": "アクセ", "name": "致命", "cls": "弓使い", "tiers": [5, 6], "text": "弓使いのアローリボルバーを変化させる。\n疾風状態で使用時、致命的な射撃を使用できる。", "only": null}, {"key": "アクセ|剣術士|舞姫", "part": "アクセ", "name": "舞姫", "cls": "剣術士", "tiers": [4, 6], "text": "剣術士のソードダンスを変化させる。\nソードダンスと秘剣:ソードダンスを使用する度に集中状態に応じてスキル使用速度がアップする。", "only": null}, {"key": "アクセ|剣術士|落花", "part": "アクセ", "name": "落花", "cls": "剣術士", "tiers": [5, 6], "text": "剣術士の秘剣を変化させる。\nそれぞれ異なる秘剣を全て使用すると、ダメージが高い\n秘剣:落花を使用できる。", "only": null}, {"key": "アクセ|魔法使い|落雷", "part": "アクセ", "name": "落雷", "cls": "魔法使い", "tiers": [4, 6], "text": "魔法使いのライトニングを変化させる。\n連鎖的な稲妻の枝の攻撃を受けた敵の頭上に雷を落とし、周辺の敵に範囲ダメージと同時に持続ダメージ:感電を付与する。\n落雷は同じ敵に重複してダメージを与えることができる。", "only": null}, {"key": "アクセ|ダンサー|蝶", "part": "アクセ", "name": "蝶", "cls": "ダンサー", "tiers": [5, 6], "text": "ダンサーのナチュラルターンを変化させる。\nナチュラルターン使用時、敵を追跡する3匹の蝶が現れて飛んでいく。\n追加で、常にターゲットに向かって突進する形で使用する。", "only": null}, {"key": "アクセ|剣術士|血の嵐", "part": "アクセ", "name": "血の嵐", "cls": "剣術士", "tiers": [4, 6], "text": "剣術士のソードダンスを変化させる。\nスキル使用時、持続ダメージ:傷を追加で付与する。", "only": null}, {"key": "アクセ|格闘家|衝突", "part": "アクセ", "name": "衝突", "cls": "格闘家", "tiers": [5, 6], "text": "格闘家のチャージングフィストを変化させる。\n打撃した敵を遠くへ飛ばし、飛ばされた敵が衝突した地点周辺の敵に範囲ダメージを与える。", "only": null}, {"key": "アクセ|戦士|覇気", "part": "アクセ", "name": "覇気", "cls": "戦士", "tiers": [4, 6], "text": "戦士の戦場の雄叫びを変化させる。\n雄叫びのダメージが大幅にアップし、次に使用するスキルのダメージが1回だけ大幅にアップする。スキル使用時に闘志アップ効果が消える。", "only": null}, {"key": "アクセ|ヒーラー|誓約", "part": "アクセ", "name": "誓約", "cls": "ヒーラー", "tiers": [4, 6], "text": "ヒーラーのライフリンクを変化させる。\n繋がった対象が味方の場合、持続回復効果を与えると同時に移動速度がアップする。繋がった対象が敵の場合、持続ダメージを与え、移動速度をダウンさせる。\n更に、味方と繋がっている時に発生する光の波動の威力がアップする。", "only": null}, {"key": "アクセ|剣術士|貫通", "part": "アクセ", "name": "貫通", "cls": "剣術士", "tiers": [5, 6], "text": "剣術士の鋼のくさびを変化させる。\n鋼のくさびまたは秘剣:鋼のくさびを\n1回使用時、範囲ダメージを与える快剣を使用できる。", "only": null}, {"key": "アクセ|ロングボウ使い|超音波", "part": "アクセ", "name": "超音波", "cls": "ロングボウ使い", "tiers": [5, 6], "text": "ロングボウ使いのハートシーカーを変化させる。\nチャージ段階ごとにターゲットの方向に半月形の衝撃波を発射する。\n半月形の衝撃波はダメージを与えてノックバックさせる。", "only": null}, {"key": "アクセ|格闘家|跳躍", "part": "アクセ", "name": "跳躍", "cls": "格闘家", "tiers": [4, 6], "text": "格闘家のストンプキックを変化させる。\n着地時、攻撃範囲が拡大し、スキルの移動距離に応じて敵に大きなダメージを与える。", "only": null}, {"key": "アクセ|司祭|車輪", "part": "アクセ", "name": "車輪", "cls": "司祭", "tiers": [4, 6], "text": "司祭のケルティッククロスを変化させる。\nケルティッククロスで攻撃成功時、シンボルの移動速度がダウンし、持続時間がアップする。", "only": null}, {"key": "アクセ|楽師|速奏", "part": "アクセ", "name": "速奏", "cls": "楽師", "tiers": [4, 6], "text": "楽師の技巧:クレッシェンドを変化させる。\n技巧:クレッシェンド使用時、演奏スキルのクールタイムがダウンする。", "only": null}, {"key": "アクセ|クロスボウ使い|連鎖", "part": "アクセ", "name": "連鎖", "cls": "クロスボウ使い", "tiers": [5, 6], "text": "クロスボウ使いのガスティングボルトを変化させる。\nガスティングボルトに電気属性が適用され、クリティカル命中時、連鎖する稲妻の枝を放出し、ターゲットと近接した敵にもダメージを与える。", "only": null}, {"key": "アクセ|魔法使い|隕石", "part": "アクセ", "name": "隕石", "cls": "魔法使い", "tiers": [5, 6], "text": "魔法使いのファイアボールをメテオストライクに切り替える。", "only": null}, {"key": "アクセ|ロングボウ使い|集中", "part": "アクセ", "name": "集中", "cls": "ロングボウ使い", "tiers": [5, 6], "text": "ロングボウ使いのフレイムアローを変化させる。\nスキルチャージが可能になり、チャージ段階に応じて打撃範囲がターゲットに集中される。", "only": null}, {"key": "アクセ|クロスボウ使い|電流", "part": "アクセ", "name": "電流", "cls": "クロスボウ使い", "tiers": [4, 6], "text": "クロスボウ使いのスプレッドボルトを変化させる。\n34％の確率でオーバーチャージされ、強化ボルト弾倉の消費なしで周辺の敵に持続ダメージ:感電を付与するサンダースプレッドボルトを使用できる。", "only": null}, {"key": "アクセ|魔法使い|霜の棘", "part": "アクセ", "name": "霜の棘", "cls": "魔法使い", "tiers": [5, 6], "text": "魔法使いのアイスダガーを変化させる。\n召喚する氷片の数が12個にアップし、召喚すると直ちにターゲットへ向かって破片を連射する。", "only": null}, {"key": "アクセ|弓使い|鷹", "part": "アクセ", "name": "鷹", "cls": "弓使い", "tiers": [5, 6], "text": "弓使いのホークショットを変化させる。\nホークショットの弱体化効果が付与されたターゲットにラッシュウィンドの跳弾効果が発生したものの、周辺に他の敵がいない場合、跳ね返った矢が戻ってきてターゲットを再度攻撃する。", "only": null}, {"key": "アクセ|ヒーラー|鼓動", "part": "アクセ", "name": "鼓動", "cls": "ヒーラー", "tiers": [4, 6], "text": "ヒーラーの生命の鼓動を変化させる。\nクールタイムがダウンし、ブレイク状態でない敵に対しても与ダメージがアップする。", "only": null}], "uses": {"アクセ|戦士|猛攻": [{"kind": "fixed", "rank": 1, "badge": "確定", "ctext": "1枠目に付ける", "brief": "ガード中の1が「制圧」になる。4回の連続攻撃と、6秒間の攻撃力+15%（闘志満タンなら+30%）", "why": "（1を変える）：ガード中の1が「制圧」になる。4回の連続攻撃と、6秒間の攻撃力+15%（闘志満タンなら+30%）", "ctx": [{"n": "猛攻", "r": ""}, {"n": "突撃", "r": ""}], "cls": "戦士", "cid": "warrior", "part": "アクセ"}], "アクセ|戦士|突撃": [{"kind": "fixed", "rank": 1, "badge": "確定", "ctext": "2枠目に付ける", "brief": "4が溜め撃ちの「貫き」になる。技の準備中・ブレイク中の敵にダメ+250%、CT−4秒", "why": "（4を変える）：4が溜め撃ちの「貫き」になる。技の準備中・ブレイク中の敵にダメ+250%、CT−4秒。戦士の火力の中心", "ctx": [{"n": "猛攻", "r": ""}, {"n": "突撃", "r": ""}], "cls": "戦士", "cid": "warrior", "part": "アクセ"}], "アクセ|戦士|覇気": [{"kind": "flow", "rank": 1, "badge": "条件つき", "ctext": "3枠目：ボス戦でスキルを手動で使うとき", "brief": "代わりに5で闘志がたまらなくなる", "why": "（5を変える）：5のダメージが上がり（倍率2.75 → 6.0）、次に使うスキル1回のダメ+70%。代わりに5で闘志がたまらなくなる", "ctx": [{"n": "覇気", "r": "ボス戦でスキルを手動で使うとき"}, {"n": "斬撃", "r": "それ以外"}], "n": 2, "cls": "戦士", "cid": "warrior", "part": "アクセ"}], "アクセ|戦士|斬撃": [{"kind": "flow", "rank": 2, "badge": "基本", "ctext": "3枠目：「ボス戦でスキルを手動で使う」に当てはまらないとき", "brief": "2が周りの円形範囲を素早く斬る技になり、火傷を付ける。当たった敵の数でダメ+50〜250%（6体まで）", "why": "（2を変える）：2が周りの円形範囲を素早く斬る技になり、火傷を付ける。当たった敵の数でダメ+50〜250%（6体まで）。雑魚に強く、火傷で松明の条件も自分で満たせる", "ctx": [ const SETFX = {
  '燃え上がる心臓': '燃え上がる心臓の被ダメUP効果が被ダメDOWN効果に切り替わる。降り注ぐ火炎が発射する炎の塊が1個→3個に。',
  '飢えた刃': '巨人の腕で付与した『破壊された鎧』が残っている敵には、飢えた刃の直接ダメージが2倍に。飢えた刃で付与した『拘束の刃』が残っていると、『破壊された鎧』の終了時に巨人の腕が威力350%の追加ダメージを与える。',
  '共鳴する水晶': '破滅の烙印の付与中は、共鳴する水晶の与ダメUP効果が1スタックあたりに2%→2.6%に。破滅の烙印の与ダメUP（1回10%）が最初から5スタックした状態になる。',
};
const HOLY = '神聖のルーン', RUIN = '破滅のルーン';
const holyOf = r => r.uniq === HOLY ? r.name : r.pair;
const short = u => u.replace('のルーン', 'ルーン');  // 注意の文では「神聖ルーン」「破滅ルーン」（11/4 G の文例）
const tag = r => r.uniq ? `<span class="tg tg-${esc(r.uniq)}"><i>固有</i>${esc(r.uniq.replace('のルーン', ''))}</span>` : '';  // 札は「固有 神聖」「固有 破滅」（ルーンなのは自明、11/4 G）
function uqHtml(r) {
  if (!r.uniq) return '';
  const other = r.uniq === HOLY ? RUIN : HOLY;
  return `<div class="uq"><div class="uqh">⚠ 付け方に注意</div>
    <p><b>${short(r.uniq)}</b>を複数付けても、効果が出るのはそのうち1つだけ。<b>${esc(r.pair)}</b>（${short(other)}）とセットで付けると、以下の追加効果を得られる。</p>
    <p class="fx">「${esc(SETFX[holyOf(r)] || '')}」</p>
    <p>交換に使うトークンは貴重なので、どのセットを付けるかを決めてから交換を推奨。</p></div>`;
}

function card(r) {
  const g = byClass(r.key);
  const rs = groups(g);
  const avoid = g.filter(x => x.tone === 'neg');
  const isOpen = S.open.has(r.key);
  const list = rs.map(G => {
    const head = G.cond ? `<span class="plain">${esc(G.label)}</span>` : `<span class="bd">${esc(G.label)}</span>`;
    const body = G.rows.map(o => {
      const names = o.cls.map(c => `<span style="--c:${CL[c].col}" class="${c === S.cls ? 'sel' : ''}">${esc(c)}</span>`).join('');
      const lines = o.lines.map(l => `<div class="ln${l.ct && l.bf ? '' : ' one'}${l.ct.length > 15 ? ' long' : ''}">${l.ct ? `<span class="sc">${esc(l.ct)}</span>` : ''}${l.bf ? `<span class="rs">${esc(l.bf)}</span>` : ''}</div>`).join('');
      const hit = S.cls && o.cls.includes(S.cls);
      const cc = CL[hit ? S.cls : o.cls[0]];
      return `<div class="cr${hit ? ' selrow' : ''}" style="--c:${cc.col};--soft:${cc.soft}"><div class="cn">${names}</div><div class="sl">${lines}</div></div>`;
    }).join('');
    return `<div class="grp ${G.t}"><div class="gh">${head}</div>${body}</div>`;
  }).join('');
  return `<div class="rn${isOpen ? ' open' : ''}" data-k="${esc(r.key)}">
    <div class="top-part">
      <i class="ri ri-${esc(r.part)}" aria-hidden="true"></i>
      <div>
      <div class="nm"><b>${esc(r.name)}</b>${stars(r.tiers)}${S.part === 'すべて' ? `<span class="pt">${esc(r.part)}</span>` : ''}${r.only ? `<span class="only">${esc(r.only)}専用</span>` : ''}${tag(r)}</div>
      <div class="ef">${String(r.text ?? '').split('\n').map(l => `<span${l.length > 80 ? ' class="lg"' : ''}>${esc(l)}</span>`).join('')}</div>
      </div>
    </div>
    ${uqHtml(r)}
    ${rs.length ? `<div class="ul">${list}</div>` : `<div class="nouse">どのクラスのおすすめにも入っていない</div>`}
    ${avoid.length ? `<div class="av"><b>付けない</b>：${avoid.map(x => esc(x.cls)).join('・')}</div>` : ''}
    <button type="button" class="more" aria-expanded="${isOpen}">${isOpen ? '閉じる' : '詳しく見る（クラスごとの理由と並び）'}</button>
    ${isOpen ? detail(r, g) : '<div class="dt"></div>'}
  </div>`;
}

function ordHtml(u) {
  if (!u.ctx) return '';
  if (u.kind === 'rank') {
    let h = '', cut = false;
    for (const x of u.ctx) {
      if (!x.in && !cut) { h += '<span class="cut">｜枠外</span>'; cut = true; }
      h += `<span class="${x.in ? 'in' : ''}${x.n === u.me ? ' me' : ''}">${esc(x.r)} ${esc(x.n)}</span>`;
    }
    return `<div class="ord">${h}</div>`;
  }
  if (u.kind === 'flow' && u.n > 1) {
    return `<div class="flw">${u.ctx.map(x => `<div class="${x.n === u.me ? 'me' : ''}">${esc(x.r)} → <b>${esc(x.n)}</b></div>`).join('')}</div>`;
  }
  if (u.kind === 'fixed' && u.ctx.length > 1) {
    return `<div class="ord">${u.ctx.map(x => `<span class="in${x.n === u.me ? ' me' : ''}">${esc(x.n)}</span>`).join('')}</div>`;
  }
  return '';
}
function ucard(cls, u) {
  const c = CL[cls], t = tone(u);
  return `<div class="cu${t === 'neg' ? ' avd' : ''}${cls === S.cls ? ' selcard' : ''}" style="--c:${c.col};--soft:${c.soft}">
    <div class="ch"><span class="cn">${esc(cls)}</span>${isCond(u) ? '' : `<span class="rk ${t}">${esc(prio(u, false))}</span>`}${u.ctext ? `<span class="cd">${esc(u.ctext)}</span>` : ''}<a href="${GURL}${c.id}" target="_blank" rel="noopener">ガイド ›</a></div>
    ${u.why ? `<div class="wy">${esc(u.why)}</div>` : ''}
    ${ordHtml(u)}
  </div>`;
}
function detail(r, g) {
  g = g || byClass(r.key);
  const main = [], low = [];
  for (const x of g) for (const u of x.us) {
    u.me = r.name;
    (tone(u) === 'top' || tone(u) === 'mid' ? main : low).push([x.cls, u]);
  }
  if (S.cls) { const f = a => a.sort((p, q) => (p[0] === S.cls ? 0 : 1) - (q[0] === S.cls ? 0 : 1)); f(main); f(low); }
  let h = '';
  h += main.length ? `<div class="cards">${main.map(([c, u]) => ucard(c, u)).join('')}</div>` : `<p class="none">どのクラスのおすすめにも入っていない。</p>`;
  if (low.length) h += `<div class="subh">補足・付けない</div><div class="cards">${low.map(([c, u]) => ucard(c, u)).join('')}</div>`;
  return `<div class="dt">${h}</div>`;
}

const hasUse = r => byClass(r.key).some(x => x.tone === 'top' || x.tone === 'mid');
function useful(r) {
  const g = byClass(r.key);
  return [g.filter(x => x.tone === 'top').length, g.filter(x => x.tone === 'mid').length];
}
function clsRankOf(r, cls) {
  const us = (D.uses[r.key] || []).filter(u => u.cls === cls).sort(cmpUse);
  return us.length ? useKey(us[0]) : [9, 0, 999];
}

function render() {
  const out = document.getElementById('out');
  const q = norm(S.q);
  let list = D.runes.filter(r => S.part === 'すべて' || r.part === S.part);
  if (S.cls) list = list.filter(r => (D.uses[r.key] || []).some(u => u.cls === S.cls && u.kind !== 'avoid'));
  if (q) {
    // 名前で当たったものだけを出す。名前で1つも当たらないときだけ効果の文で探す
    const sc = r => { const n = norm(r.name); return n === q ? 0 : n.startsWith(q) ? 1 : n.includes(q) ? 2 : 9; };
    let hit = list.map(r => [sc(r), r]).filter(([s]) => s < 9).sort((a, b) => a[0] - b[0]).map(([, r]) => r);
    let head = `<div class="sec">検索結果<small>${hit.length}件</small></div>`;
    // 名前で当たらなかったことは大きく出す（小さい見出しだと、名前で当たったと思われる）
    if (!hit.length) {
      hit = list.filter(r => norm(r.text).includes(q));
      head = `<div class="miss"><p class="m1">名前に「${esc(S.q)}」を含むルーンはない。</p><p class="m2">効果の文に「${esc(S.q)}」を含むルーン<small>${hit.length}件</small></p></div>`;
    }
    if (!hit.length) { out.innerHTML = `<div class="miss"><p class="m1">「${esc(S.q)}」に当たるルーンはない。</p></div>`; return; }
    out.innerHTML = `${head}<div class="rl">${hit.map(card).join('')}</div>`;
    return;
  }
  let h = '';
  for (const part of PARTS) {
    if (S.part !== 'すべて' && S.part !== part) continue;
    let items = list.filter(r => r.part === part);
    if (!items.length) continue;
    if (S.cls) items.sort((a, b) => cmpArr(clsRankOf(a, S.cls), clsRankOf(b, S.cls)));
    else if (part !== 'アクセ') items.sort((a, b) => { const x = useful(a), y = useful(b); return y[0] - x[0] || y[1] - x[1] || b.tiers.at(-1) - a.tiers.at(-1); });
    h += `<div class="sec">${esc(part)}<small>${items.length}種</small></div>`;
    if (part === 'アクセ' && !S.cls) {
      for (const c of D.classes) {
        const its = items.filter(r => r.cls === c.name);
        if (!its.length) continue;
        its.sort((a, b) => cmpArr(clsRankOf(a, c.name), clsRankOf(b, c.name)));
        h += `<div class="chead" style="--c:${c.col}">${esc(c.name)}</div><div class="rl">${its.map(card).join('')}</div>`;
      }
    } else {
      const used = items.filter(hasUse), unused = items.filter(r => !hasUse(r));
      h += `<div class="rl">${used.map(card).join('')}</div>`;
      if (unused.length) h += `<details class="unused"><summary>どのクラスのおすすめにも入っていないルーン（${unused.length}種）</summary><div class="rl">${unused.map(card).join('')}</div></details>`;
    }
  }
  out.innerHTML = h || '<p class="none">当てはまるルーンはない。</p>';
}

// 入力
const tabs = document.getElementById('tabs');
tabs.innerHTML = ['すべて', ...PARTS].map(p => `<button type="button" data-p="${p}" aria-pressed="${p === S.part}">${p}</button>`).join('');
tabs.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.part = b.dataset.p;
  tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.p === S.part));
  render();
});
const sel = document.getElementById('cls');
sel.innerHTML += D.classes.map(c => `<option value="${esc(c.name)}">${esc(c.name)}向け</option>`).join('');
sel.addEventListener('change', () => { S.cls = sel.value; render(); });
const qi = document.getElementById('q');
let tm;
qi.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { S.q = qi.value; S.open.clear(); render(); }, 120); });
document.getElementById('out').addEventListener('click', e => {
  const b = e.target.closest('.more'); if (!b) return;
  const el = b.closest('.rn'), k = el.dataset.k, r = D.runes.find(x => x.key === k);
  const open = !S.open.has(k);
  if (open) { S.open.add(k); el.querySelector('.dt').outerHTML = detail(r); } else S.open.delete(k);
  el.classList.toggle('open', open);
  b.setAttribute('aria-expanded', String(open));
  b.firstChild.textContent = open ? '閉じる' : '詳しく見る（クラスごとの理由と並び）';
  if (!open) el.scrollIntoView({ block: 'nearest' });
});
// ほかのページから、特定のルーンを開く（#k=部位|名前）
function openByHash() {
  const h = location.hash;
  if (!h.startsWith('#k=')) return false;
  let key = '';
  try { key = decodeURIComponent(h.slice(3)); } catch (e) { return false; }
  const r = D.runes.find(x => x.key === key);
  if (!r) return false;
  S.q = r.name; qi.value = r.name; S.cls = ''; sel.value = ''; S.part = 'すべて';
  tabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.p === S.part));
  S.open.clear();
  render();
  const el = [...document.querySelectorAll('.rn')].find(x => x.dataset.k === key);
  if (el) el.scrollIntoView({ block: 'start' });
  return true;
}
window.addEventListener('hashchange', openByHash);
if (!openByHash()) render();
</script>
</body>
</html>
